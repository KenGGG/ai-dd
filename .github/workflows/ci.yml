name: AIDDA Workbench CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production
        run: npm run build

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python scripts
        run: ruff check scripts

      - name: Validate environment.yml
        run: |
          if grep -q "requirements.txt" environment.yml; then
            echo "ERROR: environment.yml references requirements.txt which does not exist in this repo"; exit 1
          fi
          echo "environment.yml OK"

  build-artifacts:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify artifacts
        run: |
          if [ -f dist/server.cjs ]; then
            echo "Server bundle: dist/server.cjs ($(du -h dist/server.cjs | cut -f1))"
          else
            echo "ERROR: dist/server.cjs not found"
            exit 1
          fi
          if [ -f dist/index.html ]; then
            echo "Frontend: dist/index.html"
          fi
