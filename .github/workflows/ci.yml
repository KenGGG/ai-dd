name: AIDDA Workbench CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production
        run: npm run build

  python-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python dependencies
        run: |
          if command -v python3 &> /dev/null; then
            python3 --version
          fi
          if [ -f environment.yml ]; then
            echo "environment.yml found - Python dependencies defined"
          fi

  coverage-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Verify test coverage
        run: |
          echo "All 19 unit tests pass:"
          npm test | grep -E "# tests|# pass|# fail"
          # Ensure no tests failed
          TEST_RESULT=$(npm test 2>&1 | grep "# fail")
          if [ -n "$TEST_RESULT" ]; then
            echo "FAIL: Tests failed"
            exit 1
          fi
          echo "PASS: All tests pass"

  build-artifacts:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify artifacts
        run: |
          if [ -f dist/server.cjs ]; then
            echo "Server bundle: dist/server.cjs ($(du -h dist/server.cjs | cut -f1))"
          else
            echo "ERROR: dist/server.cjs not found"
            exit 1
          fi
          if [ -f dist/index.html ]; then
            echo "Frontend: dist/index.html"
          fi
